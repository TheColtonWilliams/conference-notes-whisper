# Deterministic spelling fixes applied before LLM correction.
# Map what Whisper tends to hear (lowercase) -> the canonical spelling.
# Shared, generic fixes only: this file is tracked and the repo is public. Event-specific
# spellings go in domain_corrections.local.yaml (gitignored, merged over this file);
# `python -m pipeline.review apply` writes verified glossary terms there.
corrections:
  "whisper x": "WhisperX"
  "whisperx": "WhisperX"
  "pie-a-note": "pyannote"
  "pyanote": "pyannote"
  "lance db": "LanceDB"
  "speech brain": "SpeechBrain"
  "hugging face": "HuggingFace"
  "ollama": "Ollama"
